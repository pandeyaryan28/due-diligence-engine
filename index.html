<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Due Diligence Engine</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-dark: #040406;
            --bg-card: #0c0b12;
            --accent: #7c6aff;
            --accent-glow: rgba(124, 106, 255, 0.4);
            --success: #6affb8;
            --warning: #ff6a6a;
            --text-main: #e2e2ec;
            --text-muted: #8b8b9e;
            --border: #1f1f2e;
            
            --font-head: 'Syne', sans-serif;
            --font-body: 'DM Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            
            /* Space / Gravity Motif Background */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(124, 106, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(106, 255, 184, 0.05), transparent 25%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            background-position: center center;
            background-attachment: fixed;
        }

        /* App Layout */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Sidebar Tracker */
        .sidebar {
            width: 280px;
            background: rgba(4, 4, 6, 0.8);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(10px);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .brand {
            font-family: var(--font-head);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 3rem;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        .brand span {
            color: var(--accent);
            font-size: 0.9rem;
            font-family: var(--font-body);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0.2rem;
        }

        .tracker-list {
            list-style: none;
            flex-grow: 1;
            overflow-y: auto;
        }

        .tracker-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .tracker-item::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 36px;
            bottom: -10px;
            width: 2px;
            background: var(--border);
            z-index: -1;
        }
        .tracker-item:last-child::before { display: none; }

        .tracker-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .tracker-item.active { color: #fff; }
        .tracker-item.active .tracker-icon {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            background: var(--accent);
        }

        .tracker-item.done { color: var(--text-main); }
        .tracker-item.done .tracker-icon {
            border-color: var(--success);
            background: var(--success);
            color: #000;
        }

        .tracker-item.error .tracker-icon {
            border-color: var(--warning);
            background: var(--warning);
        }

        /* Main Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            height: 70px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
            background: rgba(4, 4, 6, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .header-title {
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
        }

        .progress-bar-bg {
            width: 150px;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            transition: width 0.5s ease;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 3rem;
            scroll-behavior: smooth;
        }

        /* Landing Screen / Form */
        #landing-screen {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-title {
            font-family: var(--font-head);
            font-size: 3.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-family: var(--font-head);
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        input[type="text"], textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            color: #fff;
            font-family: var(--font-body);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(124, 106, 255, 0.15);
            background: rgba(124, 106, 255, 0.02);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .cta-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 1.2rem 2.5rem;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 1rem;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(124, 106, 255, 0.6);
            background: #8b7bff;
        }

        .cta-btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Generation Screen */
        .hidden { display: none !important; }

        #generation-screen {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 5rem;
        }

        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
            position: relative;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .section-title {
            font-family: var(--font-head);
            font-size: 1.5rem;
            color: #fff;
        }

        .section-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        /* Markdown Styling */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-family: var(--font-head);
            color: #fff;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        
        .markdown-body h2 { font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .markdown-body p { margin-bottom: 1rem; }
        
        .markdown-body ul, .markdown-body ol {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .markdown-body li { margin-bottom: 0.5rem; }
        
        .markdown-body strong { color: #fff; }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            font-size: 0.9rem;
        }

        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border);
            padding: 1rem;
            text-align: left;
        }

        .markdown-body th {
            background: rgba(255,255,255,0.03);
            color: #fff;
            font-family: var(--font-head);
        }

        .markdown-body tr:nth-child(even) {
            background: rgba(255,255,255,0.01);
        }

        /* Floating Actions */
        .floating-actions {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .error-message {
            color: var(--warning);
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        .loading-pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1s infinite alternate;
        }
        
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px var(--accent); }
        }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Tracker -->
        <aside class="sidebar">
            <div class="brand">
                ANTIGRAVITY
                <span>Due Diligence Engine</span>
            </div>
            <ul class="tracker-list" id="tracker-list">
                <!-- Populated via JS -->
            </ul>
        </aside>

        <!-- Main Content Layout -->
        <main class="main-content">
            <header class="top-bar">
                <div class="header-title" id="header-title">New Request</div>
                <div class="progress-container hidden" id="progress-container">
                    <span id="progress-text">0/10</span>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                </div>
            </header>

            <div class="content-scroll" id="scroll-container">
                <!-- Form Screen -->
                <div id="landing-screen">
                    <h1 class="hero-title">Initialize<br>Due Diligence.</h1>
                    <p class="hero-subtitle">Input the startup context. Our AI will generate a 10-point investor-grade report.</p>

                    <form id="dd-form">
                        <div class="input-group">
                            <label>Idea Title</label>
                            <input type="text" id="input-title" placeholder="e.g. Acme Space Logistics" required>
                        </div>
                        <div class="input-group">
                            <label>Idea Description</label>
                            <textarea id="input-desc" placeholder="What is it? How does it work? What problem does it solve on a technical level?" required></textarea>
                        </div>
                        <div class="input-group">
                            <label>Target Market</label>
                            <textarea id="input-market" placeholder="Who are the customers? B2B/B2C? What are the demographics?" required></textarea>
                        </div>
                        <div class="input-group">
                            <label>Unfair Advantage</label>
                            <textarea id="input-advantage" placeholder="Why you? Why now? Regulatory moats, IP, or network effects?" required></textarea>
                        </div>
                        
                        <div id="form-error" class="error-message hidden"></div>
                        <button type="submit" class="cta-btn" id="run-btn">Deploy Engine 🚀</button>
                    </form>
                </div>

                <!-- Output Screen -->
                <div id="generation-screen" class="hidden">
                    <div id="cards-container"></div>
                </div>
            </div>

            <!-- Global Actions -->
            <div class="floating-actions hidden" id="global-actions">
                <button class="action-btn" id="export-btn">📥 Export All Markdown</button>
                <button class="action-btn" id="reset-btn" style="color: var(--warning); border-color: var(--warning)">↻ Start Over</button>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script>
        const SECTIONS = [
            "Idea Report — Executive summary, core thesis, novelty score, key assumptions",
            "Problem & Solution Analysis — Problem depth, who feels it acutely, solution fit, risks",
            "Market Research — TAM/SAM/SOM estimation, market trends, tailwinds/headwinds",
            "Business Model — Revenue streams, pricing strategy, unit economics, scalability",
            "Competitor Analysis — Top 5 competitors table (name, strength, weakness, threat level)",
            "Financial Model — 3-year projection table (revenue, costs, EBITDA), key assumptions",
            "Go-To-Market Strategy — Launch strategy, channels, early adopter playbook, growth loops",
            "Product Requirements (PRD) — MVP features, phased roadmap, technical considerations",
            "Risk Register — Top 8 risks (category, severity, likelihood, mitigation)",
            "Pitch Deck Outline — 12-slide structure with talking points per slide"
        ];

        let formData = {};
        let generatedContent = {};
        let isGenerating = false;
        let abortController = null;

        // DOM Elements
        const form = document.getElementById('dd-form');
        const landingScreen = document.getElementById('landing-screen');
        const genScreen = document.getElementById('generation-screen');
        const cardsContainer = document.getElementById('cards-container');
        const trackerList = document.getElementById('tracker-list');
        const headerTitle = document.getElementById('header-title');
        const progressContainer = document.getElementById('progress-container');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const globalActions = document.getElementById('global-actions');
        const scrollContainer = document.getElementById('scroll-container');
        const runBtn = document.getElementById('run-btn');

        // Initialize Tracker UI
        function initTracker() {
            trackerList.innerHTML = '';
            SECTIONS.forEach((sec, idx) => {
                const shortName = sec.split(' — ')[0];
                const li = document.createElement('li');
                li.className = 'tracker-item';
                li.id = `tracker-${idx}`;
                li.innerHTML = `
                    <div class="tracker-icon" id="tracker-icon-${idx}">⏳</div>
                    <span class="tracker-label">${shortName}</span>
                `;
                trackerList.appendChild(li);
            });
        }

        initTracker();

        // Handle Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            formData = {
                title: document.getElementById('input-title').value.trim(),
                description: document.getElementById('input-desc').value.trim(),
                market: document.getElementById('input-market').value.trim(),
                advantage: document.getElementById('input-advantage').value.trim()
            };

            landingScreen.classList.add('hidden');
            genScreen.classList.remove('hidden');
            progressContainer.classList.remove('hidden');
            headerTitle.textContent = formData.title;
            
            cardsContainer.innerHTML = ''; // Clear previous runs
            generatedContent = {}; // Reset content
            isGenerating = true;

            await startGenerationSequence();
        });

        function updateProgress(completedCount) {
            progressText.textContent = `${completedCount}/10`;
            progressFill.style.width = `${(completedCount / 10) * 100}%`;
            
            if (completedCount === 10) {
                globalActions.classList.remove('hidden');
                isGenerating = false;
            }
        }

        function updateTrackerState(index, state) {
            const item = document.getElementById(`tracker-${index}`);
            const icon = document.getElementById(`tracker-icon-${index}`);
            
            item.className = 'tracker-item'; // reset
            
            if (state === 'active') {
                item.classList.add('active');
                icon.innerHTML = '<div class="loading-pulse"></div>';
            } else if (state === 'done') {
                item.classList.add('done');
                icon.innerHTML = '✓';
            } else if (state === 'error') {
                item.classList.add('error');
                icon.innerHTML = '!';
            } else {
                icon.innerHTML = '⏳';
            }
        }

        async function startGenerationSequence() {
            for (let i = 0; i < SECTIONS.length; i++) {
                if (!isGenerating) break; // Allow abort mechanism if needed
                
                if (i > 0) {
                    // Add 3s delay between calls to avoid Gemini Free Tier burst limits
                    await new Promise(resolve => setTimeout(resolve, 3000));
                }
                
                await processSection(i);
                updateProgress(i + 1);
            }
        }

        async function processSection(index, isRetry = false) {
            const sectionName = SECTIONS[index];
            const shortName = sectionName.split(' — ')[0];
            
            updateTrackerState(index, 'active');

            // Find or create card
            let cardId = `section-card-${index}`;
            let card = document.getElementById(cardId);
            
            if (!card) {
                card = document.createElement('div');
                card.className = 'section-card';
                card.id = cardId;
                card.innerHTML = `
                    <div class="section-header">
                        <h2 class="section-title">${shortName}</h2>
                        <div class="section-actions">
                            <button class="action-btn copy-btn" data-index="${index}">Copy</button>
                        </div>
                    </div>
                    <div class="markdown-body" id="content-${index}">
                        <p style="color: var(--accent);"><span class="loading-pulse"></span> Analyzing context...</p>
                    </div>
                    <div class="error-message hidden" id="error-${index}">
                        Failed to generate. <button class="action-btn" onclick="retrySection(${index})">Retry</button>
                    </div>
                `;
                cardsContainer.appendChild(card);
            } else {
                // If it's a retry, clear error state and markdown
                document.getElementById(`error-${index}`).classList.add('hidden');
                document.getElementById(`content-${index}`).innerHTML = '<p style="color: var(--accent);"><span class="loading-pulse"></span> Re-analyzing context...</p>';
            }

            // Scroll to the new card
            const scrollOffset = card.offsetTop - 100;
            scrollContainer.scrollTo({ top: scrollOffset, behavior: 'smooth' });

            abortController = new AbortController();

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ...formData,
                        sectionName
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    const errorObj = await response.json().catch(() => ({}));
                    const errorMsg = errorObj.error || `Server returned ${response.status}`;
                    const err = new Error(errorMsg);
                    err.status = response.status;
                    throw err;
                }

                if (!response.body) {
                    throw new Error("ReadableStream not yet supported in this browser.");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let markdownContent = '';
                const contentDiv = document.getElementById(`content-${index}`);
                contentDiv.innerHTML = ''; // Clear loading text

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            if (dataStr === '[DONE]') continue;
                            try {
                                const parsed = JSON.parse(dataStr);
                                if (parsed.candidates && parsed.candidates.length > 0) {
                                    const textPart = parsed.candidates[0].content.parts[0].text;
                                    if (textPart) {
                                        markdownContent += textPart;
                                        contentDiv.innerHTML = marked.parse(markdownContent);
                                    }
                                }
                            } catch (e) { }
                        }
                    }
                }

                generatedContent[index] = markdownContent;
                updateTrackerState(index, 'done');
                
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error("Section generation error:", error);
                
                updateTrackerState(index, 'error');
                const errorDiv = document.getElementById(`error-${index}`);
                errorDiv.classList.remove('hidden');

                if (error.status === 429) {
                    // Auto-retry with extended cooldown for free-tier limits
                    errorDiv.innerHTML = `Google Free Tier Limit! Cooling down for <span id="countdown-${index}">15</span>s...`;
                    let timeLeft = 15;
                    
                    return new Promise((resolve, reject) => {
                        const timer = setInterval(() => {
                            timeLeft -= 1;
                            const cdSpan = document.getElementById(`countdown-${index}`);
                            if (cdSpan) cdSpan.textContent = timeLeft;
                            
                            if (timeLeft <= 0) {
                                clearInterval(timer);
                                document.getElementById(`error-${index}`).classList.add('hidden');
                                document.getElementById(`content-${index}`).innerHTML = '<p style="color: var(--accent);"><span class="loading-pulse"></span> Retrying...</p>';
                                // Retry and resolve
                                processSection(index, true).then(resolve).catch(reject);
                            }
                        }, 1000);
                    });
                } else {
                    // Manual retry for other errors
                    errorDiv.innerHTML = `Failed to generate: <strong>${error.message}</strong> <button class="action-btn" onclick="retrySection(${index})">Retry</button>`;
                    throw error; // Pause generation sequence
                }
            }
        }

        // Global function for inline retries
        window.retrySection = async function(index) {
            try {
                await processSection(index, true);
                if (index < SECTIONS.length - 1) {
                    // Resume sequential loop from the failed index + 1
                    isGenerating = true;
                    for (let i = index + 1; i < SECTIONS.length; i++) {
                        if (!isGenerating) break;
                        
                        await new Promise(resolve => setTimeout(resolve, 3000)); // 3s throttle

                        await processSection(i);
                        updateProgress(i + 1);
                    }
                } else {
                    updateProgress(index + 1);
                }
            } catch(e) {
                // If retry fails again, the loop stops again. User clicks retry again.
            }
        };

        // Actions
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('copy-btn')) {
                const index = e.target.getAttribute('data-index');
                const content = generatedContent[index];
                if (content) {
                    navigator.clipboard.writeText(content);
                    const origText = e.target.innerText;
                    e.target.innerText = 'Copied!';
                    setTimeout(() => { e.target.innerText = origText; }, 2000);
                }
            }
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            let fullDoc = `# Due Diligence Report: ${formData.title}\n\n`;
            
            for (let i = 0; i < SECTIONS.length; i++) {
                if (generatedContent[i]) {
                    fullDoc += `## ${SECTIONS[i].split(' — ')[0]}\n\n`;
                    fullDoc += generatedContent[i] + `\n\n---\n\n`;
                }
            }

            const blob = new Blob([fullDoc], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Due_Diligence_${formData.title.replace(/\s+/g, '_')}.md`;
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if (isGenerating && abortController) {
                abortController.abort();
            }
            
            form.reset();
            landingScreen.classList.remove('hidden');
            genScreen.classList.add('hidden');
            progressContainer.classList.add('hidden');
            globalActions.classList.add('hidden');
            headerTitle.textContent = 'New Request';
            
            cardsContainer.innerHTML = '';
            initTracker();
            progressFill.style.width = '0%';
            progressText.textContent = '0/10';
            
            isGenerating = false;
        });

    </script>
</body>
</html>
